# ====================================================================
# KARTHIK JEWELLERS & VISWANANDINI BRIDAL HOUSE
# Apache 2.4 Enterprise High-Performance Reverse Proxy Configuration
# Port: 80 -> Node.js Express Backend (Port 5000)
# ====================================================================

ProxyPreserveHost On
ProxyRequests Off

# Pass client real IP, host, and protocol headers
RequestHeader set X-Forwarded-Proto "http"
RequestHeader set X-Forwarded-Port "80"

# Real-Time SSE live rate & portal streaming (/api/sync/stream)
# Disables buffering and compression for instant multi-device tick streaming
<Location /api/sync/stream>
    ProxyPass http://127.0.0.1:5000/api/sync/stream flushpackets=on
    ProxyPassReverse http://127.0.0.1:5000/api/sync/stream
    SetEnv no-gzip 1
    Header set Cache-Control "no-cache, no-transform"
</Location>

# Real-Time SSE live events streaming (/api/sync/events fallback)
<Location /api/sync/events>
    ProxyPass http://127.0.0.1:5000/api/sync/events flushpackets=on
    ProxyPassReverse http://127.0.0.1:5000/api/sync/events
    SetEnv no-gzip 1
    Header set Cache-Control "no-cache, no-transform"
</Location>

# WebSockets support
<Location /ws>
    ProxyPass ws://127.0.0.1:5000/ws
    ProxyPassReverse ws://127.0.0.1:5000/ws
</Location>

# Proxy all API endpoints
<Location /api>
    ProxyPass http://127.0.0.1:5000/api
    ProxyPassReverse http://127.0.0.1:5000/api
</Location>

# Proxy static assets and storefront roots to Express backend
ProxyPass / http://127.0.0.1:5000/
ProxyPassReverse / http://127.0.0.1:5000/

# High-Speed Gzip Deflate Compression for Text / JS / CSS / JSON / SVG
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml image/svg+xml
</IfModule>

# Browser Caching Headers for Lightning-Fast Repeat Visits
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresDefault "access plus 1 hour"
    
    # Images (Cache 30 days)
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType image/x-icon "access plus 1 year"
    
    # CSS & JavaScript (Cache 30 days)
    ExpiresByType text/css "access plus 30 days"
    ExpiresByType application/javascript "access plus 30 days"
    ExpiresByType text/javascript "access plus 30 days"
    
    # Fonts (Cache 1 year)
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType font/woff "access plus 1 year"
</IfModule>
